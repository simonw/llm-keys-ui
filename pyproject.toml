[project]
name = "llm-keys-ui"
version = "0.1"
description = "A local web UI for managing LLM API keys"
readme = "README.md"
authors = [{name = ""}]
license = "Apache-2.0"
classifiers = []
requires-python = ">=3.10"
dependencies = [
    "llm",
    "psutil",
    "starlette",
    "uvicorn",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.entry-points.llm]
keys_ui = "llm_keys_ui"

[dependency-groups]
dev = ["httpx", "pytest"]
